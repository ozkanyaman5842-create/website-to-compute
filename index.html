<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drive Videoları</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#111;color:#eee}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  h1{font-size:22px;margin:6px 0 18px}
  .card{background:#1b1b1b;border:1px solid #2a2a2a;border-radius:14px;margin:14px 0;overflow:hidden}
  .card h2{font-size:16px;margin:0;padding:10px 14px;border-bottom:1px solid #2a2a2a;font-weight:600}
  .player{position:relative;width:100%;aspect-ratio:16/9}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .note{font-size:13px;color:#aaa;margin-top:18px;line-height:1.4}
  a{color:#7cc0ff}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Videolar</h1>

    <div class="card">
      <h2>Video 1</h2>
      <div class="player">
        <iframe src="https://drive.google.com/file/d/1Le5PUSe_mvqegA06VQSGduH27R6BTpab/preview" allow="autoplay"></iframe>
      </div>
    </div>

    <div class="card">
      <h2>Video 2</h2>
      <div class="player">
        <iframe src="https://drive.google.com/file/d/1y7rYJTMcOf8vPp4UT4MC8y35IND14iW-/preview" allow="autoplay"></iframe>
      </div>
    </div>

    <div class="card">
      <h2>Video 3</h2>
      <div class="player">
        <iframe src="https://drive.google.com/file/d/1n4oekvdYaKjs5Bz8xmCzWIE5uiUZzzm-/preview" allow="autoplay"></iframe>
      </div>
    </div>

    <div class="card">
      <h2>Video 4</h2>
      <div class="player">
        <iframe src="https://drive.google.com/file/d/1Ss8dxP1JLYy25Op-v1cYs1DbgXtSNI8W/preview" allow="autoplay"></iframe>
      </div>
    </div>

    <p class="note">
      Not: Bu videolar Google Drive oynatıcıyla gömülüdür. Eğer “izlenemiyor” hatası görürsen,
      Drive’daki dosya paylaşımını “Bağlantıya sahip olan herkes → Görüntüleyebilir” olarak ayarla.
    </p>
  </div>
</body>
</html>
